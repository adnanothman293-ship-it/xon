<style>
:root{--bg:#0d0d0f;--bg2:#141417;--card:#1b1b1f;--card2:#232328;--line:#2f2f36;--gold:#e8bf45;--gold2:#c09528;--goldsoft:rgba(232,191,69,.13);--text:#f5f2ea;--muted:#a9a49b;--ok:#3cc380;--bad:#ef5b51;--r:16px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{font-family:'Tajawal',system-ui,-apple-system,'Segoe UI',sans-serif;background:var(--bg);background-image:radial-gradient(900px 500px at 110% -10%,rgba(232,191,69,.10),transparent 60%);background-attachment:fixed;color:var(--text);font-size:16px;line-height:1.55;min-height:100vh}
button,input,select,textarea{font-family:inherit;font-size:16px;color:inherit}
a{color:var(--gold)}
.top{position:sticky;top:0;z-index:20;background:rgba(13,13,15,.88);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top)}
.topin{max-width:780px;margin:0 auto;display:flex;align-items:center;gap:10px;padding:10px 16px}
.ttl{flex:1;font-weight:800;font-size:18px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tlogo{width:38px;height:38px;border-radius:50%;box-shadow:0 0 0 2px var(--goldsoft)}
.ib{min-width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--gold);font-size:17px;display:grid;place-items:center;cursor:pointer;padding:0 10px;font-weight:700}
.ib:active{transform:scale(.95)}
.ib.sm{min-width:32px;height:32px;font-size:14px;padding:0 8px}
.danger-t{color:var(--bad)!important}
main{max-width:780px;margin:0 auto;padding:16px 16px calc(40px + env(safe-area-inset-bottom))}
.enter{animation:enter .28s ease}
@keyframes enter{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.card{background:linear-gradient(180deg,var(--card),var(--bg2));border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:12px;box-shadow:0 6px 20px rgba(0,0,0,.28)}
.card.off{opacity:.55}
.ct{font-weight:800;color:var(--gold);margin-bottom:10px;font-size:16px}
.sect{font-weight:800;color:var(--gold);margin:18px 4px 8px}
.muted{color:var(--muted);font-size:14px}
.small{font-size:13px}
.center{text-align:center}
.hint{color:var(--muted);font-size:14px;background:var(--goldsoft);border:1px dashed rgba(232,191,69,.35);border-radius:12px;padding:8px 12px;margin:6px 0 12px}
.empty{text-align:center;color:var(--muted);padding:28px 16px}
.loading{display:grid;place-items:center;padding:60px 0}
.spin{display:inline-block;width:18px;height:18px;border:2.5px solid rgba(0,0,0,.25);border-top-color:currentColor;border-radius:50%;animation:sp .7s linear infinite;vertical-align:middle}
.spin.big{width:34px;height:34px;border-width:3px;border-color:var(--line);border-top-color:var(--gold)}
@keyframes sp{to{transform:rotate(360deg)}}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:46px;padding:10px 16px;border-radius:13px;border:1px solid transparent;font-weight:700;cursor:pointer;transition:transform .08s,filter .15s;text-decoration:none}
.btn:active{transform:scale(.97)}
.btn:disabled{opacity:.6;cursor:default}
.btn.primary{background:linear-gradient(135deg,#f3d26a,var(--gold) 45%,var(--gold2));color:#1a1405;box-shadow:0 6px 18px rgba(232,191,69,.25)}
.btn.ghost{background:var(--card2);border-color:var(--line);color:var(--text)}
.btn.gold-outline{background:transparent;border-color:var(--gold);color:var(--gold)}
.btn.danger{background:linear-gradient(135deg,#ff7a6f,var(--bad));color:#fff}
.btn.link{background:none;border:none;color:var(--gold);min-height:36px;padding:6px 8px}
.btn.block{width:100%;margin-top:10px}
.btn.sm{min-height:38px;padding:6px 12px;font-size:14px;border-radius:11px}
.acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.acts.sm{margin-top:0;flex-wrap:nowrap}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.row2>.fl{margin-bottom:0}
.card>.row2{margin-bottom:12px}
.fl{display:block;margin-bottom:12px}
.fl>span{display:block;font-size:14px;color:var(--muted);margin-bottom:6px;font-weight:500}
.fl input,.fl select,.inp,.search{width:100%;min-height:48px;padding:10px 14px;border-radius:12px;border:1px solid var(--line);background:#111114;color:var(--text);outline:none;transition:border .15s,box-shadow .15s}
.fl input:focus,.fl select:focus,.inp:focus,.search:focus{border-color:var(--gold);box-shadow:0 0 0 3px var(--goldsoft)}
input[type=date]{min-height:48px;color-scheme:dark;direction:ltr;text-align:right;cursor:pointer}
input[type=date]::-webkit-calendar-picker-indicator{filter:invert(78%) sepia(60%) saturate(500%) hue-rotate(5deg);opacity:1;cursor:pointer;width:22px;height:22px}
.inp{margin-bottom:8px}
.seg{display:flex;gap:6px;background:#111114;border:1px solid var(--line);border-radius:12px;padding:4px}
.seg button{flex:1;min-height:40px;border:none;border-radius:9px;background:none;color:var(--muted);font-weight:700;cursor:pointer}
.seg button.on{background:var(--gold);color:#1a1405}
.pill{display:inline-block;padding:2px 10px;border-radius:999px;background:var(--goldsoft);color:var(--gold);font-size:13px;font-weight:700;white-space:nowrap}
.pill.dim{background:var(--card2);color:var(--muted)}
.pill.gold{font-size:15px;margin-bottom:12px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chip{display:inline-block;padding:3px 10px;border-radius:999px;background:var(--card2);border:1px solid var(--line);font-size:13px}
.chip.ok{color:var(--ok);border-color:rgba(60,195,128,.4)}
.chip.bad{color:var(--bad);border-color:rgba(239,91,81,.45)}
.chip.dim{color:var(--muted)}
.chip.gold{color:var(--gold);border-color:rgba(232,191,69,.45)}
.pc-h{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:4px}
.pc-h b{font-size:17px}
.pcard{cursor:pointer}
.pcard:active{transform:scale(.99)}
.money{color:var(--gold);font-size:14px;margin-top:4px;font-weight:700}
.hero{display:flex;align-items:center;gap:14px;padding:18px;border-radius:20px;margin-bottom:14px;background:linear-gradient(135deg,#1f1b10,#141417 60%);border:1px solid rgba(232,191,69,.25)}
.hero img{width:64px;height:64px;border-radius:50%;box-shadow:0 0 0 3px var(--goldsoft),0 8px 24px rgba(0,0,0,.5)}
.hname{font-weight:800;font-size:20px}
.hrole{color:var(--gold);font-weight:700}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tile{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;min-height:118px;padding:14px;border-radius:18px;border:1px solid var(--line);background:linear-gradient(160deg,var(--card2),var(--bg2));cursor:pointer;color:var(--text);transition:transform .1s,border-color .2s}
.tile:active{transform:scale(.97);border-color:var(--gold)}
.tic{font-size:32px}
.tt{font-weight:800;font-size:16px;text-align:center}
.badge{position:absolute;top:10px;left:10px;min-width:26px;height:26px;border-radius:13px;background:var(--bad);color:#fff;font-weight:800;font-size:14px;display:grid;place-items:center;padding:0 7px}
.badge.zero{display:none}
.biocard{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;border-color:rgba(232,191,69,.35)}
.biocard .acts{margin-top:0}
.items{margin-top:12px;border-top:1px dashed var(--line);padding-top:8px}
.irow{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
.irow:last-child{border-bottom:none}
.locbox{margin-top:10px;background:#111114;border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.locbox .lt{font-weight:700;font-size:14px;margin-bottom:6px}
.locline{display:flex;justify-content:space-between;font-size:14px;padding:3px 0}
.locline span:last-child{color:var(--gold)}
.locline.done span:last-child{color:var(--ok)}

const sb=window.supabase.createClient(SB_URL,SB_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:false}});
const ROLE_NAMES={gm:'المدير العام',fm:'المدير المالي',ops:'مدير العمليات',coord:'المنسّق',dept:'حساب قسم'};
const UNITS=['عدد','متر','كيلو','وزن','علبة'];
let ME=null, DEPTS=[], navStack=[], current=null, renderToken=0, bellTimer=null, SIG=null;
const QC={};       // كاش منتجات القسم حسب رقم السجل

const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function fmtDT(t){
  if(!t) return '—';
  const d=new Date(new Date(t).getTime()+3*3600e3); if(isNaN(d)) return String(t);
  const p=n=>String(n).padStart(2,'0'); let h=d.getUTCHours(); const ap=h<12?'ص':'م'; h=h%12||12;
  return `${p(d.getUTCDate())}/${p(d.getUTCMonth()+1)}/${d.getUTCFullYear()} ${p(h)}:${p(d.getUTCMinutes())} ${ap}`;
}
function fmtD(d){ if(!d) return '—'; const p=String(d).slice(0,10).split('-'); return p.length===3?`${p[2]}/${p[1]}/${p[0]}`:String(d); }
function money(n){ return (n===null||n===undefined||n==='')?'—':Number(n).toLocaleString('en-US',{maximumFractionDigits:2})+'\u00a0د.ع'; }
const qtyFmt=n=>Number(n).toLocaleString('en-US',{maximumFractionDigits:3});
const isFin=()=>!!ME&&(ME.role==='gm'||ME.role==='fm');
const isOverseer=()=>!!ME&&['gm','fm','ops','coord'].includes(ME.role);
const myDept=()=>ME&&ME.department_id?DEPTS.find(d=>d.id===ME.department_id):null;
const isSales=()=>myDept()?.kind==='sales';
const isTech=()=>myDept()?.kind==='technical';
const isInstall=()=>myDept()?.kind==='installation';
const deptName=id=>DEPTS.find(d=>d.id===Number(id))?.name||'';
function baghdadToday(){ const n=new Date(Date.now()+3*3600e3); return Date.UTC(n.getUTCFullYear(),n.getUTCMonth(),n.getUTCDate())-3*3600e3; }
function deadlineSoon(d){ if(!d) return false; const t=Date.parse(String(d).slice(0,10)+'T00:00:00+03:00'); return t-baghdadToday()<=2*864e5; }
function lsGet(k){ try{ return localStorage.getItem(k); }catch(_){ return null; } }
function lsSet(k,v){ try{ localStorage.setItem(k,v); }catch(_){ } }
function lsDel(k){ try{ localStorage.removeItem(k); }catch(_){ } }

function toast(msg,type='ok'){ const t=$('toast'); t.textContent=msg; t.className='show '+type; clearTimeout(t._h); t._h=setTimeout(()=>{t.className='';},3400); }
function errText(e){
  if(e&&e.name==='NotAllowedError') return 'تم إلغاء العملية';
  let m=(e&&(e.message||e.error_description||e.msg))||String(e||'');
  if(/Failed to fetch|NetworkError|Load failed|network/i.test(m)) return 'تعذّر الاتصال بالإنترنت، حاول مرة ثانية';
  if(/JWT|not authenticated|session/i.test(m)) return 'انتهت الجلسة، سجّل الدخول من جديد';
  if(/duplicate key|stage_logs_one_open/i.test(m)) return 'تمت هذه العملية مسبقاً، حدّث الصفحة';
  return m||'حدث خطأ غير متوقع';
}
async function rpc(name,args={}){ const {data,error}=await sb.rpc(name,args); if(error) throw error; return data; }
async function manage(action,body={}){
  const {data,error}=await sb.functions.invoke('manage',{body:{action,...body}});
  if(error){ let m=error.message; try{ const j=await error.context.json(); if(j&&j.error) m=j.error; }catch(_){ } throw new Error(m); }
  if(data&&data.error) throw new Error(data.error);
  return data;
}
async function busy(btn,fn){
  if(btn&&btn.disabled) return;
  const old=btn?btn.innerHTML:'';
  if(btn){ btn.disabled=true; btn.innerHTML='<span class="spin"></span>'; }
  try{ return await fn(); }
  catch(e){ toast(errText(e),'bad'); }
  finally{ if(btn&&btn.isConnected){ btn.disabled=false; btn.innerHTML=old; } }
}
function confirmBox(msg,okText='تأكيد',danger=false){
  return new Promise(res=>{
    const m=$('modal');
    m.innerHTML=`<div class="mback"><div class="mbox"><div class="mmsg">${esc(msg)}</div><div class="row2"><button class="btn ${danger?'danger':'primary'}" id="mOk">${okText}</button><button class="btn ghost" id="mNo">إلغاء</button></div></div></div>`;
    m.style.display='block';
    const done=v=>{ m.style.display='none'; m.innerHTML=''; res(v); };
    $('mOk').onclick=()=>done(true); $('mNo').onclick=()=>done(false);
  });
}
function inputBox(msg,val=''){
  return new Promise(res=>{
    const m=$('modal');
    m.innerHTML=`<div class="mback"><div class="mbox"><div class="mmsg">${esc(msg)}</div><input class="inp" id="mIn" value="${esc(val)}"><div class="row2" style="margin-top:8px"><button class="btn primary" id="mOk">حفظ</button><button class="btn ghost" id="mNo">إلغاء</button></div></div></div>`;
    m.style.display='block'; setTimeout(()=>$('mIn')&&$('mIn').focus(),50);
    const done=v=>{ m.style.display='none'; m.innerHTML=''; res(v); };
    $('mOk').onclick=()=>{ const v=$('mIn').value.trim(); done(v||null); };
    $('mNo').onclick=()=>done(null);
  });
}
function field(id,label,val='',type='text',extra=''){
  return `<label class="fl"><span>${label}</span><input id="${id}" type="${type==='number'?'text':type}" value="${esc(val??'')}" ${type==='number'?'inputmode="decimal" autocomplete="off" data-num="1"':''} ${extra}></label>`;
}
function qrSvg(text){ const q=qrcode(0,'M'); q.addData(String(text)); q.make(); return q.createSvgTag({cellSize:6,margin:2,scalable:true}); }
function waitImages(root,timeout=6000){
  const imgs=[...root.querySelectorAll('img')].filter(i=>!i.complete);
  if(!imgs.length) return Promise.resolve();
  return Promise.race([Promise.all(imgs.map(i=>new Promise(r=>{ i.onload=i.onerror=r; }))),new Promise(r=>setTimeout(r,timeout))]);
}
async function printHTML(html,opts={}){
  const pa=$('printArea'); pa.innerHTML=html;
  let ps=$('pageStyle'); if(!ps){ ps=document.createElement('style'); ps.id='pageStyle'; document.head.appendChild(ps); }
  ps.textContent=`@media print{@page{size:A4 ${opts.landscape?'landscape':'portrait'};margin:10mm}}`;
  const t0=Date.now();
  toast('جاري تجهيز الطباعة...');
  await waitImages(pa);
  if(Date.now()-t0<1200){ setTimeout(()=>window.print(),150); return; }
  // تجهيز طويل: نطلب ضغطة من المستخدم حتى لا يمنع المتصفح نافذة الطباعة
  const m=$('modal');
  m.innerHTML=`<div class="mback"><div class="mbox center"><div class="mmsg">✅ الطباعة جاهزة</div><div class="row2"><button class="btn primary" id="mOk">🖨️ اطبع الآن</button><button class="btn ghost" id="mNo">إلغاء</button></div></div></div>`;
  m.style.display='block';
  const close=()=>{ m.style.display='none'; m.innerHTML=''; };
  $('mOk').onclick=()=>{ close(); window.print(); }; $('mNo').onclick=close;
}
async function signUrls(bucket,paths){
  const out={}; paths=[...new Set((paths||[]).filter(Boolean))];
  if(!paths.length) return out;
  try{ const {data}=await sb.storage.from(bucket).createSignedUrls(paths,3600); (data||[]).forEach(d=>{ if(d&&d.signedUrl) out[d.path]=d.signedUrl; }); }catch(_){ }
  return out;
}
const isImg=(type,name)=>/^image\//.test(type||'')||/\.(jpe?g|png|gif|webp|heic|heif)$/i.test(name||'');
function fileExt(name,type){ const m=/\.([a-z0-9]{1,6})$/i.exec(name||''); if(m) return m[1].toLowerCase(); if(/jpeg/.test(type||'')) return 'jpg'; if(/png/.test(type||'')) return 'png'; if(/pdf/.test(type||'')) return 'pdf'; return 'bin'; }
const rid=()=>Date.now()+'_'+Math.random().toString(36).slice(2,8);
async function uploadProductFile(pid,folder,file){
  if(file.size>15*1024*1024) throw new Error('حجم الملف كبير جداً (الحد 15 ميغا)');
  let blob=file, type=file.type||'application/octet-stream', ext=fileExt(file.name,type);
  if(isImg(type,file.name)&&!/gif/.test(type)){ try{ blob=await compressImage(file,1600,0.78); type='image/jpeg'; ext='jpg'; }catch(_){ } }
  const path=`${pid}/${folder}/${rid()}.${ext}`;
  const {error}=await sb.storage.from('product-files').upload(path,blob,{contentType:type,upsert:false});
  if(error) throw new Error('تعذّر رفع الملف: '+(error.message||''));
  return {path,type,name:file.name||('ملف.'+ext)};
}
function dur(a,b){
  if(!a) return '—'; const ms=(b?new Date(b):new Date())-new Date(a); if(!(ms>=0)) return '—';
  const m=Math.round(ms/60000), d=Math.floor(m/1440), h=Math.floor((m%1440)/60), mi=m%60;
  return d?`${d} يوم ${h} س`:(h?`${h} س ${mi} د`:`${mi} د`);
}
function hoursTxt(h){ if(h==null) return '—'; h=Number(h); return h>=24?`${(h/24).toFixed(1)} يوم`:`${h} س`; }
const printHead=t=>`<div class="ph"><img src="${LOGO}"><div><h2>XON PRODUCTION</h2><div>${esc(t)} — طُبع ${fmtDT(new Date())}</div></div></div>`;
function groupBy(rows){ const m=new Map(); rows.forEach(r=>{ if(!m.has(r.product_id)) m.set(r.product_id,{pid:r.product_id,rows:[]}); m.get(r.product_id).rows.push(r); }); return [...m.values()]; }

function go(screen,params={}){ if(current) navStack.push(current); current={screen,params}; render(); }
function replaceScreen(screen,params={}){ current={screen,params}; render(); }
function goBack(){ current=navStack.pop()||{screen:'home',params:{}}; render(); }
function goHome(){ navStack=[]; current={screen:'home',params:{}}; render(); }
function shell(title,inner){
  const home=current&&current.screen==='home';
  return `<header class="top"><div class="topin">${home?`<img class="tlogo" src="${LOGO}" alt="">`:`<button class="ib" onclick="goBack()" aria-label="رجوع">→</button>`}<div class="ttl">${esc(title)}</div>${home?`<button class="ib" onclick="logout()">خروج</button>`:`<button class="ib" onclick="goHome()" aria-label="الرئيسية">⌂</button>`}</div></header><main id="content">${inner}</main>`;
}
async function render(){
  stopCamera(); SIG=null;
  const tok=++renderToken; const s=SCREENS[current.screen];
  if(!s){ goHome(); return; }
  const title=typeof s.title==='function'?s.title(current.params):s.title;
  $('app').innerHTML=shell(title,'<div class="loading"><span class="spin big"></span></div>');
  window.scrollTo(0,0);
  try{
    const html=await s.view(current.params);
    if(tok!==renderToken) return;
    const c=$('content'); c.innerHTML=html; c.classList.add('enter');
    if(s.after) s.after(current.params);
  }catch(e){
    if(tok!==renderToken) return;
    $('content').innerHTML=`<div class="card empty">⚠️ ${esc(errText(e))}<br><br><button class="btn ghost" onclick="render()">إعادة المحاولة</button></div>`;
  }
}

function showLogin(msg){
  stopCamera(); stopBell(); navStack=[]; current=null;
  $('app').innerHTML=`<div class="login"><img src="${LOGO}" class="llogo" alt="XON PRODUCTION"><h1>XON PRODUCTION</h1><div class="lsub">نظام تتبع مراحل المنتج</div>

  <button class="btn primary block" id="l_btn" onclick="doLogin(this)">تسجيل الدخول</button>${msg?`<div class="err">${esc(msg)}</div>`:''}</div></div>`;
  $('l_pass').onkeydown=e=>{ if(e.key==='Enter') doLogin($('l_btn')); };

async function doLogin(btn){
  await busy(btn,async()=>{
    const email=$('l_email').value.trim(), password=$('l_pass').value;
    if(!email||!password) throw new Error('اكتب الإيميل وكلمة المرور');
    const {error}=await sb.auth.signInWithPassword({email,password});
    if(error) throw new Error(/invalid/i.test(error.message)?'الإيميل أو كلمة المرور غير صحيحة':error.message);
    await afterLogin(false);
  });
}
async function loadMe(){
  const {data:{user}}=await sb.auth.getUser();
  if(!user) throw new Error('انتهت الجلسة، سجّل الدخول من جديد');
  const [pr,dp]=await Promise.all([sb.from('profiles').select('*').eq('id',user.id).maybeSingle(),sb.from('departments').select('*').order('sort_order')]);
  if(pr.error) throw pr.error; if(dp.error) throw dp.error;
  if(!pr.data){ await sb.auth.signOut(); throw new Error('هذا الحساب غير مربوط بالنظام'); }
  ME={...pr.data,email:user.email}; DEPTS=dp.data||[];
}
async function afterLogin(checkBio){
  await loadMe();
  if(checkBio&&bioEnabled()) return showBioLock();
  startBell(); pushRefreshSilently(); if(!openFromLink()) goHome();
}
async function logout(){
  if(!await confirmBox('تسجيل الخروج من النظام؟','خروج')) return;
  stopBell();
  try{ const reg=await swReady(); const sub=reg&&await reg.pushManager.getSubscription(); if(sub) await sub.unsubscribe(); }catch(_){ }
  await sb.auth.signOut(); ME=null; showLogin();
}

const b64u={enc:buf=>btoa(String.fromCharCode(...new Uint8Array(buf))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,''),
  dec:s=>{ s=s.replace(/-/g,'+').replace(/_/g,'/'); while(s.length%4) s+='='; return Uint8Array.from(atob(s),c=>c.charCodeAt(0)); }};
const bioKey=()=>'xp_bio_'+ME.id;
const bioEnabled=()=>!!(ME&&lsGet(bioKey()));
async function bioAvailable(){ try{ return !!(window.PublicKeyCredential&&await PublicKeyCredential.isUserVerifyingPlatformAuthenticatorAvailable()); }catch(_){ return false; } }
async function bioCard(){
  if(bioEnabled()||lsGet('xp_bio_skip_'+ME.id)) return '';
  if(!await bioAvailable()) return '';
  return `<div class="card biocard"><div>🔐 فعّل الدخول بالبصمة / الوجه على هذا الجهاز</div><div class="acts"><button class="btn primary sm" onclick="enableBio(this)">تفعيل</button><button class="btn link sm" onclick="lsSet('xp_bio_skip_'+ME.id,'1');render()">لاحقاً</button></div></div>`;
}
async function enableBio(btn){
  await busy(btn,async()=>{
    const cred=await navigator.credentials.create({publicKey:{challenge:crypto.getRandomValues(new Uint8Array(32)),rp:{name:'XON PRODUCTION',id:location.hostname},
      user:{id:new TextEncoder().encode(ME.id),name:ME.email,displayName:ME.full_name||ME.email},
      pubKeyCredParams:[{type:'public-key',alg:-7},{type:'public-key',alg:-257}],
      authenticatorSelection:{authenticatorAttachment:'platform',userVerification:'required'},timeout:60000,attestation:'none'}});
    if(!cred) throw new Error('لم يتم التفعيل');
    lsSet(bioKey(),b64u.enc(cred.rawId)); toast('تم تفعيل الدخول بالبصمة ✅'); render();
  });
}
function showBioLock(){
  $('app').innerHTML=`<div class="login"><img src="${LOGO}" class="llogo" alt=""><h1>XON PRODUCTION</h1><div class="lsub">${esc(ME.full_name||ME.email)}</div>
  <div class="card center"><button class="btn primary block" onclick="bioUnlock(this)">🔐 افتح ببصمتك</button><button class="btn link" onclick="bioFallback()">الدخول بكلمة المرور</button></div></div>`;
}
async function bioUnlock(btn){
  await busy(btn,async()=>{
    await navigator.credentials.get({publicKey:{challenge:crypto.getRandomValues(new Uint8Array(32)),allowCredentials:[{type:'public-key',id:b64u.dec(lsGet(bioKey()))}],userVerification:'required',timeout:60000}});
    startBell(); pushRefreshSilently(); if(!openFromLink()) goHome();
  });
}
async function bioFallback(){ await sb.auth.signOut(); ME=null; showLogin(); }
function disableBio(){ lsDel(bioKey()); lsDel('xp_bio_skip_'+ME.id); toast('تم إلغاء البصمة على هذا الجهاز'); render(); }

function startBell(){ stopBell(); if(!isOverseer()) return; bellTimer=setInterval(refreshBell,30000); }
function stopBell(){ if(bellTimer) clearInterval(bellTimer); bellTimer=null; }
async function refreshBell(){ const b=document.querySelector('[data-bell]'); if(!b) return; try{ const n=await rpc('get_unread_count'); b.textContent=n; b.classList.toggle('zero',!n); }catch(_){ } }

/* ================= إشعارات الموبايل ================= */
const pushSupported=()=>('serviceWorker' in navigator)&&('PushManager' in window)&&('Notification' in window);
const isIOS=()=>/iphone|ipad|ipod/i.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
const isStandalone=()=>window.matchMedia('(display-mode: standalone)').matches||navigator.standalone===true;
let SW_REG=null;
async function swReady(){
  if(!('serviceWorker' in navigator)) return null;
  if(SW_REG) return SW_REG;
  try{ await navigator.serviceWorker.register('sw.js'); SW_REG=await navigator.serviceWorker.ready; }catch(_){ SW_REG=null; }
  return SW_REG;
}
function b64uToBytes(s){ s=s.replace(/-/g,'+').replace(/_/g,'/'); while(s.length%4) s+='='; return Uint8Array.from(atob(s),c=>c.charCodeAt(0)); }
async function pushSubscribe(){
  const reg=await swReady(); if(!reg) throw new Error('المتصفح لا يدعم الإشعارات');
  let sub=await reg.pushManager.getSubscription();
  if(!sub) sub=await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:b64uToBytes(VAPID_PUB)});
  const j=sub.toJSON();
  await rpc('save_push_sub',{p_endpoint:j.endpoint,p_p256dh:j.keys.p256dh,p_auth:j.keys.auth,p_ua:navigator.userAgent});
  return sub;
}
async function pushStatus(){
  if(!pushSupported()) return isIOS()&&!isStandalone()?'ios-install':'unsupported';
  if(Notification.permission==='denied') return 'denied';
  if(Notification.permission!=='granted') return 'off';
  try{ const reg=await swReady(); const sub=reg&&await reg.pushManager.getSubscription(); if(!sub) return 'off'; return (await rpc('has_push_sub',{p_endpoint:sub.endpoint}))?'on':'off'; }catch(_){ return 'off'; }
}
async function pushCard(){
  const st=await pushStatus();
  if(st==='on'||st==='unsupported') return '';
  if(st==='ios-install') return `<div class="card biocard"><div>🔔 لتصلك الإشعارات على الآيفون: اضغط <b>مشاركة</b> ثم <b>إضافة إلى الشاشة الرئيسية</b>، وافتح النظام من الأيقونة الجديدة.</div></div>`;
  if(st==='denied') return `<div class="card biocard"><div>🔕 الإشعارات مرفوضة على هذا الجهاز. فعّلها من إعدادات المتصفح أو الموبايل لهذا الموقع.</div></div>`;
  return `<div class="card biocard"><div>🔔 فعّل الإشعارات على هذا الجهاز لتصلك حتى والنظام مغلق</div><div class="acts"><button class="btn primary sm" onclick="enablePush(this)">تفعيل الإشعارات</button></div></div>`;
}
async function enablePush(btn){
  await busy(btn,async()=>{
    const perm=await Notification.requestPermission();
    if(perm!=='granted') throw new Error('لم يتم السماح بالإشعارات');
    await pushSubscribe();
    toast('تم تفعيل الإشعارات على هذا الجهاز ✅'); render();
  });
}
async function pushRefreshSilently(){ try{ if(pushSupported()&&Notification.permission==='granted') await pushSubscribe(); }catch(_){ } }
function openFromLink(h){
  h=h||location.hash||''; if(!h||!ME) return false;
  try{ history.replaceState(null,'',location.pathname+location.search); }catch(_){ }
  const m=/^#p=([0-9a-f-]{36})/i.exec(h);
  if(m){ navStack=[{screen:'home',params:{}}]; current={screen:'productDetails',params:{id:m[1]}}; render(); return true; }
  if(h==='#q'&&ME.role==='dept'){ navStack=[{screen:'home',params:{}}]; current={screen:'queue',params:{}}; render(); return true; }
  return false;
}
if('serviceWorker' in navigator) navigator.serviceWorker.addEventListener('message',ev=>{ if(ev.data&&ev.data.type==='open') openFromLink(ev.data.url); });

      p_cost:S.form.canPrice?num('f_cost'):null,p_price:S.form.canPrice?num('f_price'):null};
    if(!a.p_product_name||!a.p_customer) throw new Error('اسم المنتج واسم العميل مطلوبان');
    const img=$('f_img')?.files?.[0]||null;
    const noteText=($('f_note')?.value||'').trim(), noteFile=attFile('f_nfile','f_nimg');
    if(noteFile&&noteFile.size>15*1024*1024) throw new Error('حجم المرفق كبير جداً (الحد 15 ميغا)');
    let id=S.form.id;
    if(id) await rpc('update_product2',{p_id:id,...a});
    else { const r=await rpc('create_product2',a); id=r.id; }
    if(img){
      try{ const up=await uploadProductFile(id,'image',img); await rpc('set_product_image',{p_id:id,p_path:up.path}); }
      catch(e){ toast('تم حفظ المنتج لكن تعذّر رفع الصورة: '+errText(e),'bad'); }
    }
    if(!S.form.id&&(noteText||noteFile)){
      try{ let up=null; if(noteFile) up=await uploadProductFile(id,'notes',noteFile);
        await rpc('add_note',{p_product:id,p_item:null,p_note:noteText||null,p_file_path:up?up.path:null,p_file_name:up?up.name:null,p_file_type:up?up.type:null}); }
      catch(e){ toast('تم حفظ المنتج لكن تعذّر حفظ الملاحظة: '+errText(e),'bad'); }
    }
    if(S.form.id){ toast('تم حفظ التعديلات ✅'); goBack(); }
    else{ toast('تم حفظ المنتج ✅'); replaceScreen('productLabel',{id,fresh:1}); }
  });
}

const REASON_TXT={forward:l=>'حُوّل إلى '+(l.forwarded_to||''),split:()=>'قُسّم لأيتمات',installed:()=>'تم التركيب',sold:()=>'بيع من المبيعات'};
function logNotes(l,print){
  const n=[];
  if(l.closed_reason&&REASON_TXT[l.closed_reason]) n.push((print?'':'➡️ ')+esc(REASON_TXT[l.closed_reason](l)));
  if(l.assigned) n.push('👥 مُسند إلى: '+esc(l.assigned));
  if(l.received_time) n.push('📦 استلام: '+fmtDT(l.received_time));
  if(l.installer_name) n.push('👷 الأسطى: '+esc(l.installer_name));
  if(l.site_arrival_time) n.push('📍 وصول الموقع: '+fmtDT(l.site_arrival_time));
  if(l.photo_path&&!print){ const u=S.photos&&S.photos[l.photo_path]; if(u) n.push(`<a href="${u}" target="_blank" rel="noopener">📷 صورة التركيب</a>`); }
  return n.join('<br>')||'—';
}
function itemsLocations(f){
  return f.items.map(it=>{
    const open=f.logs.find(l=>l.item_id===it.id&&!l.exit_time);
    const done=f.logs.some(l=>l.item_id===it.id&&(l.closed_reason==='installed'||l.closed_reason==='sold'));
    return {...it,where:open?open.department:(done?'✅ مكتمل':'—'),done:!open&&done};
  });
}
function productStatus(f){
  const open=f.logs.filter(l=>!l.exit_time);
  const done=!open.length;
  const doneAt=done&&f.logs.length?f.logs.reduce((m,l)=>l.exit_time&&l.exit_time>m?l.exit_time:m,''):null;
  const where=open.length?[...new Set(open.map(l=>l.department+(l.item_name?' ('+l.item_name+')':'')))].join('، '):'✅ مكتمل';
  const dl=f.product.deadline;
  let late=false;
  if(dl){ const lim=Date.parse(String(dl).slice(0,10)+'T23:59:59+03:00'); late=done?(doneAt&&Date.parse(doneAt)>lim):(Date.now()>lim); }
  return {done,doneAt,where,late};
}
function noteHtml(n,urls,print){

SCREENS.productDetails={title:'تفاصيل المنتج',async view(p){
  const f=await loadFullWithFiles(p.id);
  const acts=[`<button class="btn primary" onclick="printDossier()">🖨️ طباعة الملف الشامل</button>`,`<button class="btn ghost" onclick="go('productLabel',{id:'${p.id}'})">🏷️ الباركود</button>`];
  if(isFin()||isSales()) acts.push(`<button class="btn ghost" onclick="go('productForm',{id:'${p.id}'})">✏️ تعديل</button>`);
  if(isFin()) acts.push(`<button class="btn danger" onclick="deleteProduct('${p.id}',this)">🗑️ حذف</button>`);
  return (isFin()?mgrForwardCard(f):'')+detailsHtml(f)+`<div class="acts">${acts.join('')}</div>`;
}};
function mgrForwardCard(f){
  const open=f.logs.filter(l=>!l.exit_time&&DEPTS.find(d=>d.id===l.department_id)?.kind!=='installation');
  if(!open.length) return '';
  const pid=f.product.id, itemsOpen=open.filter(l=>l.item_id), deps=new Set(itemsOpen.map(l=>l.department_id));
  const btns=open.map(l=>l.item_id
    ?`<button class="btn ghost sm" onclick="go('forward',{pid:'${pid}',item:'${l.item_id}',mgr:1})">🚚 ${esc(l.item_name)} <span class="muted small">(${esc(l.department)})</span></button>`
    :`<button class="btn primary" onclick="go('forward',{pid:'${pid}',mgr:1})">🚚 تحويل المنتج <span class="small">(الآن في ${esc(l.department)})</span></button>`).join('');
  const all=itemsOpen.length>1&&itemsOpen.length===f.items.length&&deps.size===1?`<button class="btn gold-outline block" onclick="go('forward',{pid:'${pid}',all:1,mgr:1})">🚚 تحويل كل الأيتمات (${itemsOpen.length}) دفعة واحدة</button>`:'';
  return `<div class="card"><div class="ct">🚚 تحويل (صلاحية المدير)</div><div class="acts" style="margin-top:0">${btns}</div>${all}</div>`;
}
function printDossier(){ printHTML(dossierHtml(S.full)); }
async function printProductById(id,btn){ await busy(btn,async()=>{ await loadFullWithFiles(id); await printHTML(dossierHtml(S.full)); }); }
async function deleteProduct(id,btn){
  if(!await confirmBox('حذف هذا المنتج نهائياً مع كل حركاته وموادّه وملاحظاته؟ لا يمكن التراجع.','حذف نهائي',true)) return;
  await busy(btn,async()=>{ await manage('delete_product',{id}); toast('تم حذف المنتج'); goBack(); });
}
async function renameItem(id,btn){
  const it=S.full.items.find(i=>i.id===id); const v=await inputBox('اسم الايتم الجديد',it?it.name:''); if(!v) return;
  await busy(btn,async()=>{ await rpc('rename_item',{p_item:id,p_name:v}); toast('تم التعديل ✅'); render(); });
}
async function deleteItem(id,btn){
  if(!await confirmBox('حذف هذا الايتم نهائياً مع كل حركاته؟','حذف',true)) return;
  await busy(btn,async()=>{ await manage('delete_item',{id}); toast('تم الحذف'); render(); });
}

SCREENS.notes={title:'الملاحظات والمرفقات',async view(p){
  let r=p.log?QC[p.log]:null;
  if(!r&&ME.role==='dept'){ try{ const q=await rpc('get_my_queue2'); q.forEach(x=>QC[x.log_id]=x); r=q.find(x=>x.product_id===p.pid&&!x.item_id)||q.find(x=>x.product_id===p.pid)||null; }catch(_){ } }
  const [full,notes]=await Promise.all([rpc('get_product_full',{p_id:p.pid}),rpc('get_notes',{p_product:p.pid})]);
  if(!full) throw new Error('المنتج غير موجود');
  const urls=await signUrls('product-files',notes.map(n=>n.file_path));
  const canAdd=isOverseer()||!!r;
  S.notes={pid:p.pid,item:r?r.item_id:null};
  return `<div class="card"><div class="pc-h"><b>${esc(full.product.product_name)}${r&&r.item_name?' — 🔹 '+esc(r.item_name):''}</b><span class="pill">${esc(full.product.product_number)}</span></div><div class="muted">العميل: ${esc(full.product.customer_name)}</div></div>
    <div class="card"><div class="ct">كل ملاحظات المنتج (${notes.length})</div>${notes.length?notes.map(n=>noteHtml(n,urls,false)).join(''):'<div class="muted">لا توجد ملاحظات بعد</div>'}</div>
    ${canAdd?`<div class="card"><div class="ct">➕ ملاحظة جديدة</div><textarea id="n_text" class="inp" placeholder="اكتب الملاحظة هنا..."></textarea>
      <div class="fl"><span>مرفق (صورة أو ملف) — اختياري</span><span class="att-prev" id="n_prev">📎 لا يوجد مرفق</span><div class="att-btns"><label><input type="file" id="n_img" accept="image/*" onchange="pickAtt(this,'n_file','n_prev')">🖼️ صورة (المعرض)</label><label><input type="file" id="n_file" accept="application/pdf,.pdf,.doc,.docx,.xls,.xlsx,.txt" onchange="pickAtt(this,'n_img','n_prev')">📄 ملف</label></div></div>
      <button class="btn primary block" onclick="saveNote(this)">💾 حفظ الملاحظة</button><div class="muted small center" style="margin-top:8px">الملاحظة تصل للمدراء فوراً كإشعار</div></div>`:'<div class="hint">إضافة الملاحظات متاحة للقسم الذي يوجد عنده المنتج حالياً</div>'}`;
}};
function pickNoteFile(inp){ const f=inp.files&&inp.files[0]; if(!f) return; $('n_prev').innerHTML=isImg(f.type,f.name)?`<img src="${URL.createObjectURL(f)}" alt="">`:`📎 ${esc(f.name)}`; }
async function saveNote(btn){
  await busy(btn,async()=>{
    const text=$('n_text').value.trim(), file=attFile('n_file','n_img');
    if(!text&&!file) throw new Error('اكتب ملاحظة أو أرفق ملفاً');
    let up=null; if(file) up=await uploadProductFile(S.notes.pid,'notes',file);
    await rpc('add_note',{p_product:S.notes.pid,p_item:S.notes.item,p_note:text||null,p_file_path:up?up.path:null,p_file_name:up?up.name:null,p_file_type:up?up.type:null});
    toast('تم حفظ الملاحظة ✅'); render();
  });
}

/* ================= منتجات القسم ================= */
function locBlock(pl,total){
  if(!total) return '';
  const done=pl.filter(l=>l.status==='done').length;
  return `<div class="locbox"><div class="lt">📍 أماكن الأيتمات — مكتمل ${done} من ${total} · متبقي ${total-done}</div>${pl.map(l=>`<div class="locline ${l.status==='done'?'done':''}"><span>🔹 ${esc(l.item_name)}</span><span>${l.status==='open'?esc(l.department_name):(l.status==='done'?'✅ مكتمل':'—')}</span></div>`).join('')}</div>`;
}
function installState(r){ return !r.received_time?'⏳ لم يُستلم بعد':(!r.site_arrival_time?'📦 مستلم — بانتظار الوصول للموقع':'📍 في الموقع — بانتظار إنهاء التركيب'); }
function queueCard(g,locs){
  const f=g.rows[0], prodRow=g.rows.find(r=>!r.item_id), itemRows=g.rows.filter(r=>r.item_id);
  const pl=locs.filter(l=>l.product_id===g.pid), total=f.items_total, kind=myDept()?.kind;
  const notesBtn=(log,sm)=>`<button class="btn ghost ${sm?'sm':''}" onclick="go('notes',{pid:'${g.pid}',log:'${log}'})">📝${sm?'':' ملاحظات'}${f.notes_count?` (${f.notes_count})`:''}</button>`;
  let h=`<div class="card qcard" data-s="${esc((f.product_name+' '+f.customer_name+' '+f.product_number+' '+f.barcode+' '+(f.odoo_number||'')).toLowerCase())}">
    <div class="pc-h"><b>${esc(f.product_name)}</b><span class="pill">${esc(f.product_number)}</span></div>
    <div class="muted">العميل: ${esc(f.customer_name)}${f.odoo_number?' · الرقم الثاني: <span dir="ltr">'+esc(f.odoo_number)+'</span>':''}${f.delivery_address?' · 📍 '+esc(f.delivery_address):''}</div>
    <div class="chips">${f.deadline?`<span class="chip ${deadlineSoon(f.deadline)?'bad':'dim'}">⏰ التسليم ${fmtD(f.deadline)}</span>`:''}${f.notes_count?`<span class="chip gold">📝 ${f.notes_count} ملاحظة</span>`:''}</div>`;
  if(total>0) h+=locBlock(pl,total);
  if(kind==='installation'){
    h+=`<div class="items">${g.rows.map(r=>`<div class="irow"><div><b>${r.item_name?'🔹 '+esc(r.item_name):'المنتج كامل'}</b><div class="muted small">${installState(r)}</div></div></div>`).join('')}</div>
      <div class="acts"><button class="btn primary" onclick="go('install',{pid:'${g.pid}'})">🛠️ تركيب</button>${notesBtn(g.rows[0].log_id,false)}<button class="btn link" onclick="go('productDetails',{id:'${g.pid}'})">ℹ️ التفاصيل</button></div></div>`;
    return h;
  }
  if(prodRow){
    h+=`<div class="muted small" style="margin-top:8px">وصل للقسم: ${fmtDT(prodRow.entry_time)} · منذ ${dur(prodRow.entry_time)}</div><div class="acts">`;
    if(kind==='technical') h+=`<button class="btn primary" onclick="go('split',{pid:'${g.pid}'})">✂️ تقسيم لأيتمات</button>`;
    h+=`<button class="btn ${kind==='technical'?'ghost':'primary'}" onclick="go('forward',{pid:'${g.pid}',log:'${prodRow.log_id}'})">🚚 تحويل${kind==='technical'?' المنتج كامل':''}</button>`;
    if(kind==='sales') h+=`<button class="btn ghost" onclick="go('receipt',{pid:'${g.pid}'})">🧾 وصل بيع</button><button class="btn ghost" onclick="go('productForm',{id:'${g.pid}'})">✏️ تعديل</button>`;
    h+=`<button class="btn ghost" onclick="go('materials',{log:'${prodRow.log_id}'})">🧪 المواد${prodRow.materials_count?` (${prodRow.materials_count})`:''}</button>${notesBtn(prodRow.log_id,false)}</div>`;
  }
  if(itemRows.length){
    h+=`<div class="items">${itemRows.map(r=>`<div class="irow"><div><b>🔹 ${esc(r.item_name)}</b><div class="muted small">وصل: ${fmtDT(r.entry_time)}</div></div><div class="acts sm"><button class="btn primary sm" onclick="go('forward',{pid:'${g.pid}',log:'${r.log_id}'})">🚚 تحويل</button><button class="btn ghost sm" onclick="go('materials',{log:'${r.log_id}'})">🧪${r.materials_count?' '+r.materials_count:''}</button>${notesBtn(r.log_id,true)}</div></div>`).join('')}</div>`;
    if(itemRows.length===total&&total>1) h+=`<button class="btn gold-outline block" onclick="go('forward',{pid:'${g.pid}',all:1})">🚚 تحويل كل الأيتمات (${total}) دفعة واحدة</button>`;
  }
  if(kind==='technical'&&!prodRow) h+=`<button class="btn ghost block" onclick="go('addItem',{pid:'${g.pid}'})">➕ إضافة ايتم</button>`;
  h+=`<div class="acts"><button class="btn link" onclick="go('productDetails',{id:'${g.pid}'})">ℹ️ تفاصيل المنتج</button></div></div>`;
  return h;
}
SCREENS.queue={title:p=>p.productId?'المنتج':'منتجات '+(myDept()?.name||'قسمي'),async view(p){
  const rows=await rpc('get_my_queue2'); rows.forEach(r=>QC[r.log_id]=r);
  const pids=[...new Set(rows.filter(r=>r.items_total>0).map(r=>r.product_id))];
  const locs=pids.length?await rpc('get_items_locations',{p_products:pids}):[];
  let groups=groupBy(rows); if(p.productId) groups=groups.filter(g=>g.pid===p.productId);
  if(!groups.length) return `<div class="card empty">${p.productId?'المنتج غير موجود في قسمك حالياً':'📭 لا توجد منتجات في قسمك حالياً'}</div>`;
  return (p.productId?'':`<div class="card"><input id="qsearch" class="search" type="search" placeholder="بحث داخل منتجات قسمي..."></div><div class="muted center" style="margin-bottom:8px">${groups.length} منتج</div>`)+`<div id="qlist">${groups.map(g=>queueCard(g,locs)).join('')}</div>`;
},after(){ const i=$('qsearch'); if(i) i.oninput=()=>{ const q=i.value.trim().toLowerCase(); document.querySelectorAll('#qlist .qcard').forEach(c=>{ c.style.display=!q||c.dataset.s.includes(q)?'':'none'; }); }; }};

/* ================= التحويل ================= */
SCREENS.forward={title:p=>p.all?'تحويل كل الأيتمات':'تحويل المنتج',async view(p){
  let info;
  if(p.mgr){
    const f=await rpc('get_product_full',{p_id:p.pid}); if(!f) throw new Error('المنتج غير موجود');
    const open=f.logs.filter(l=>!l.exit_time&&(p.all?!!l.item_id:(l.item_id||null)===(p.item||null)));
    if(!open.length) throw new Error('المنتج غير موجود في أي قسم حالياً');
    info={product_name:f.product.product_name,product_number:f.product.product_number,customer_name:f.product.customer_name,item_name:p.all?null:open[0].item_name,items_total:f.items.length,from:open[0].department_id,item:p.all?null:(p.item||null)};
  }else{
    const r=p.log?QC[p.log]:Object.values(QC).find(x=>x.product_id===p.pid);
    if(!r) throw new Error('أعد فتح قائمة منتجات القسم');
    info={product_name:r.product_name,product_number:r.product_number,customer_name:r.customer_name,item_name:r.item_name,items_total:r.items_total,from:ME.department_id,item:p.all?null:(r.item_id||null)};
  }
  const fromDept=DEPTS.find(d=>d.id===info.from);
  const [act,visited]=await Promise.all([rpc('get_active_departments'),rpc('get_visited_departments',{p_product:p.pid,p_item:info.item})]);
  const opts=act.filter(d=>d.id!==fromDept.id&&!visited.includes(d.id)&&(!fromDept.allowed_targets||fromDept.allowed_targets.includes(d.id)));
  S.fwd={pid:p.pid,item:info.item,all:!!p.all,to:null,name:'',inst:null};
  const head=`<div class="card"><div class="pc-h"><b>${esc(info.product_name)}</b><span class="pill">${esc(info.product_number)}</span></div><div class="muted">العميل: ${esc(info.customer_name)}${p.mgr?` · الآن في: <b>${esc(fromDept.name)}</b>`:''}</div>${p.all?`<div class="chip gold" style="margin-top:8px">كل الأيتمات (${info.items_total})</div>`:(info.item_name?`<div class="chip gold" style="margin-top:8px">🔹 ${esc(info.item_name)}</div>`:'')}</div>`;
  if(!opts.length) return head+`<div class="card empty">لا يوجد قسم متاح للتحويل.<br><span class="small">(الأقسام التي مرّ بها المنتج أو غير المفعّلة لا تظهر)</span></div>`;
  return head+`<div class="card"><div class="ct">اختر القسم التالي</div>${fromDept.allowed_targets?'<div class="hint">من قسم '+esc(fromDept.name)+' يتم التحويل فقط إلى: '+fromDept.allowed_targets.map(deptName).join('، ')+'</div>':''}${opts.map(d=>`<button class="opt" data-id="${d.id}" onclick="pickDept(this,${d.id})"><span class="dot"></span>${esc(d.name)}</button>`).join('')}
    <div id="instPick"></div>
    <button class="btn primary block" id="fwdBtn" onclick="doForward(this)" disabled>🚚 تأكيد التحويل</button></div>`;
}};
async function pickDept(el,id){
  document.querySelectorAll('.opt[data-id]').forEach(o=>o.classList.remove('on')); el.classList.add('on');
  S.fwd.to=id; S.fwd.name=deptName(id); S.fwd.inst=null; $('fwdBtn').disabled=false;
  const box=$('instPick'); box.innerHTML='';
  if(DEPTS.find(d=>d.id===id)?.kind!=='installation') return;
  box.innerHTML='<div class="loading" style="padding:16px 0"><span class="spin big"></span></div>';
  try{
    const acc=await rpc('get_dept_accounts',{p_dept:id});
    if(S.fwd.to!==id) return;
    S.fwd.inst={all:true,ids:new Set(),list:acc};
    box.innerHTML=`<div class="ct" style="margin-top:14px">أرسل إلى</div><div class="chips" id="instChips"><button type="button" class="tabchip on" data-all="1" onclick="toggleInst(this)">👥 الكل</button>${acc.map(a=>`<button type="button" class="tabchip" data-id="${a.id}" onclick="toggleInst(this)">${esc(a.label)}</button>`).join('')}</div><div class="muted small" id="instHint" style="margin-top:6px">يظهر المنتج لكل حسابات التركيب</div>`;
  }catch(e){ box.innerHTML=`<div class="hint">⚠️ ${esc(errText(e))}</div>`; }
}
function toggleInst(b){
  const st=S.fwd.inst; if(!st) return;
  if(b.dataset.all){ st.all=true; st.ids.clear(); }
  else{ st.all=false; const id=b.dataset.id; st.ids.has(id)?st.ids.delete(id):st.ids.add(id); if(!st.ids.size) st.all=true; }
  document.querySelectorAll('#instChips .tabchip').forEach(c=>c.classList.toggle('on',c.dataset.all?st.all:(!st.all&&st.ids.has(c.dataset.id))));
  const names=st.list.filter(a=>st.ids.has(a.id)).map(a=>a.label);
  $('instHint').textContent=st.all?'يظهر المنتج لكل حسابات التركيب':'يظهر المنتج فقط لـ: '+names.join('، ');
}
async function doForward(btn){
  if(!S.fwd.to) return toast('اختر القسم','bad');
  await busy(btn,async()=>{
    const st=S.fwd.inst, assign=(st&&!st.all&&st.ids.size)?[...st.ids]:null;
    if(S.fwd.all) await rpc('forward_all_items2',{p_product:S.fwd.pid,p_to:S.fwd.to,p_assign:assign});
    else await rpc('forward_product2',{p_product:S.fwd.pid,p_item:S.fwd.item,p_to:S.fwd.to,p_assign:assign});
    const who=assign?' ('+st.list.filter(a=>st.ids.has(a.id)).map(a=>a.label).join('، ')+')':'';
    toast('تم التحويل إلى '+S.fwd.name+who+' ✅'); goBack();
  });
}

/* ================= المواد المستخدمة ================= */
function matHistory(){ try{ return JSON.parse(lsGet('xp_mats')||'[]'); }catch(_){ return []; } }
function saveMatName(n){ const a=matHistory().filter(x=>x!==n); a.unshift(n); lsSet('xp_mats',JSON.stringify(a.slice(0,40))); }
function segPick(b){ b.parentNode.querySelectorAll('button').forEach(x=>x.classList.remove('on')); b.classList.add('on'); }
SCREENS.materials={title:'المواد المستخدمة',async view(p){
  const r=QC[p.log]; if(!r) throw new Error('أعد فتح قائمة منتجات القسم');
  S.mat=r;
  const list=await rpc('get_materials',{p_product:r.product_id,p_item:r.item_id,p_only_mine:true});
  return `<div class="card"><div class="pc-h"><b>${esc(r.product_name)}${r.item_name?' — '+esc(r.item_name):''}</b><span class="pill">${esc(r.product_number)}</span></div>
    <div class="muted small">المواد المسجّلة من قسم ${esc(myDept()?.name||'')}</div>
    ${list.length?list.map(m=>`<div class="mrow"><div><b>${esc(m.material_name)}</b><div class="muted small">${fmtDT(m.created_at)}</div></div><div class="mq">${qtyFmt(m.quantity)} <span>${esc(m.unit)}</span></div>${m.removable?`<button class="ib sm danger-t" onclick="removeMaterial('${m.id}',this)">✕</button>`:''}</div>`).join(''):'<div class="muted center" style="padding:12px">لم تُضف مواد بعد</div>'}</div>
    <div class="card"><div class="ct">➕ إضافة مادة</div>
    ${field('m_name','اسم المادة','','text','list="matNames" autocomplete="off"')}<datalist id="matNames">${matHistory().map(n=>`<option value="${esc(n)}">`).join('')}</datalist>
    ${field('m_qty','الكمية','','number')}
    <div class="fl"><span>الوحدة</span><div class="seg" id="m_unit">${UNITS.map(u=>`<button type="button" class="${u==='عدد'?'on':''}" data-u="${u}" onclick="segPick(this)">${u}</button>`).join('')}</div></div>
    <button class="btn primary block" onclick="addMaterial(this)">إضافة المادة</button></div>`;
}};
async function addMaterial(btn){
  await busy(btn,async()=>{
    const name=$('m_name').value.trim(), qty=Number(normDigits($('m_qty').value).replace(/,/g,'')), unit=document.querySelector('#m_unit .on')?.dataset.u;
    if(!name) throw new Error('اكتب اسم المادة');
    if(!isFinite(qty)||qty<=0) throw new Error('اكتب كمية صحيحة');
    await rpc('add_material',{p_product:S.mat.product_id,p_item:S.mat.item_id,p_name:name,p_qty:qty,p_unit:unit});
    saveMatName(name); S.mat.materials_count=(S.mat.materials_count||0)+1;
    toast('تمت إضافة المادة ✅'); render();
  });
}
async function removeMaterial(id,btn){
  if(!await confirmBox('حذف هذه المادة؟','حذف',true)) return;
  await busy(btn,async()=>{ await manage('remove_material',{id}); S.mat.materials_count=Math.max(0,(S.mat.materials_count||1)-1); toast('تم الحذف'); render(); });
}

/* ================= التكنيكال: تقسيم وإضافة أيتمات ================= */
const splitInput=()=>`<input class="inp si" placeholder="اسم أو رقم الايتم">`;
SCREENS.split={title:'تقسيم المنتج لأيتمات',async view(p){
  const r=Object.values(QC).find(x=>x.product_id===p.pid&&!x.item_id); if(!r) throw new Error('أعد فتح قائمة منتجات القسم');
  S.split={pid:p.pid};

function setupSig(canvas){
  const r=canvas.getBoundingClientRect(), dpr=window.devicePixelRatio||1;
  canvas.width=Math.round(r.width*dpr); canvas.height=Math.round(r.height*dpr);
  const ctx=canvas.getContext('2d'); ctx.scale(dpr,dpr); ctx.fillStyle='#fff'; ctx.fillRect(0,0,r.width,r.height);
  ctx.lineWidth=2.4; ctx.lineCap='round'; ctx.lineJoin='round'; ctx.strokeStyle='#111';
  let drawing=false, has=false, last=null;
  const pos=e=>{ const t=e.touches?e.touches[0]:e, b=canvas.getBoundingClientRect(); return {x:t.clientX-b.left,y:t.clientY-b.top}; };
  const start=e=>{ e.preventDefault(); drawing=true; last=pos(e); ctx.beginPath(); ctx.arc(last.x,last.y,1.1,0,Math.PI*2); ctx.fillStyle='#111'; ctx.fill(); has=true; };
  const move=e=>{ if(!drawing) return; e.preventDefault(); const p=pos(e); ctx.beginPath(); ctx.moveTo(last.x,last.y); ctx.lineTo(p.x,p.y); ctx.stroke(); last=p; has=true; };
  const end=()=>{ drawing=false; };
  if(window.PointerEvent){
    canvas.addEventListener('pointerdown',e=>{ try{ canvas.setPointerCapture(e.pointerId); }catch(_){} start(e); });
    canvas.addEventListener('pointermove',move); canvas.addEventListener('pointerup',end); canvas.addEventListener('pointercancel',end);
  }else{
    canvas.addEventListener('touchstart',start,{passive:false}); canvas.addEventListener('touchmove',move,{passive:false}); canvas.addEventListener('touchend',end);
    canvas.addEventListener('mousedown',start); canvas.addEventListener('mousemove',move); window.addEventListener('mouseup',end);
  }
  return {clear(){ ctx.fillStyle='#fff'; ctx.fillRect(0,0,r.width,r.height); has=false; },isEmpty:()=>!has,data:()=>canvas.toDataURL('image/png')};
}

let camStream=null, camRAF=null;
async function startCamera(video,onCode){
  camStream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'}},audio:false});
  if(!video.isConnected){ stopCamera(); return; }
  video.srcObject=camStream; video.setAttribute('playsinline',''); await video.play();
  const c=document.createElement('canvas'), ctx=c.getContext('2d',{willReadFrequently:true});
  const tick=()=>{
    if(!camStream) return;
    if(video.readyState>=2&&video.videoWidth){
      const s=Math.min(1,720/Math.max(video.videoWidth,video.videoHeight));
      c.width=Math.round(video.videoWidth*s); c.height=Math.round(video.videoHeight*s);
      ctx.drawImage(video,0,0,c.width,c.height);
      const code=jsQR(ctx.getImageData(0,0,c.width,c.height).data,c.width,c.height,{inversionAttempts:'dontInvert'});
      if(code&&code.data){ stopCamera(); onCode(code.data); return; }
    }
    camRAF=requestAnimationFrame(tick);
  };
  tick();
}
function stopCamera(){ if(camRAF) cancelAnimationFrame(camRAF); camRAF=null; if(camStream){ camStream.getTracks().forEach(t=>t.stop()); camStream=null; } }

    <tbody>${rows.map((r,i)=>`<tr><td>${i+1}</td><td>${esc(r.product_number)}</td><td>${esc(r.odoo_number||'—')}</td><td><b>${esc(r.product_name)}</b>${r.item_name?`<div class="small">🔹 ${esc(r.item_name)}</div>`:''}${r.done_by?`<div class="small">👤 ${open?'مُسند إلى':'نفّذه'}: ${esc(r.done_by)}</div>`:''}${r.installer_name?`<div class="small">👷 الأسطى: ${esc(r.installer_name)}</div>`:''}</td><td>${esc(r.customer_name)}</td>${fin?`<td>${money(r.cost)}</td><td>${money(r.price)}</td>`:''}<td>${fmtD(r.deadline)}</td><td>${fmtDT(r.entry_time)}</td>${open?'':`<td>${fmtDT(r.exit_time)}</td>`}<td>${hoursTxt(r.duration_hours)}</td>${open?'':`<td>${esc(RESULT_TXT[r.closed_reason]?RESULT_TXT[r.closed_reason](r):'—')}</td>`}<td class="small">${esc(r.materials||'—')}</td><td>${r.notes_count||'—'}</td></tr>`).join('')}</tbody>
    ${fin&&rows.length?`<tfoot><tr><td colspan="5">الإجمالي (${rows.length})</td><td>${money(sum('cost'))}</td><td>${money(sum('price'))}</td><td colspan="${open?4:6}"></td></tr></tfoot>`:''}</table>${print?'':'</div>'}`;
}
function deptKpis(rows,open){
  const n=rows.length, avg=n?rows.reduce((a,r)=>a+Number(r.duration_hours||0),0)/n:0;
  const k=[['العدد',n],[open?'متوسط الانتظار':'متوسط مدة العمل',n?hoursTxt(Math.round(avg*10)/10):'—']];
  if(isFin()){ const c=rows.reduce((a,r)=>a+(Number(r.cost)||0),0), s=rows.reduce((a,r)=>a+(Number(r.price)||0),0); k.push(['مجموع التكلفة',money(c)],['مجموع البيع',money(s)]); }
  return k;
}

    ${p.period==='custom'?`<div class="card filters"><label class="fl"><span>من</span><input type="date" id="r_from" value="${esc(p.from||'')}"></label><label class="fl"><span>إلى</span><input type="date" id="r_to" value="${esc(p.to||'')}"></label><button class="btn primary" onclick="replaceScreen('deptReport',{dept:${p.dept},period:'custom',from:$('r_from').value,to:$('r_to').value})">عرض</button></div>`:''}

/* ================= تقرير المنتجات الشامل ================= */
const PSTATUS=[['all','الكل'],['open','قيد التنفيذ'],['done','مكتمل'],['late','متأخر']];
const RPERIODS=[['day','اليوم'],['week','آخر 7 أيام'],['month','هذا الشهر'],['year','هذه السنة'],['all','كل الفترات'],['custom','فترة محددة']];
function prKpis(rows){
  const done=rows.filter(r=>r.is_done).length, late=rows.filter(r=>r.late).length;
  const k=[['عدد المنتجات',rows.length,''],['مكتمل',done,'ok'],['قيد التنفيذ',rows.length-done,''],['متأخر',late,late?'bad':'']];
  if(isFin()){ const c=rows.reduce((a,r)=>a+(Number(r.cost)||0),0), s=rows.reduce((a,r)=>a+(Number(r.price)||0),0); k.push(['مجموع التكلفة',money(c),''],['مجموع البيع',money(s),''],['صافي الربح',money(s-c),s-c<0?'bad':'ok']); }
  return k;
}
function productsTable(rows,print){
  const fin=isFin(), cls=print?'dt2':'tbl';
  const sum=k=>rows.reduce((a,r)=>a+(Number(r[k])||0),0);
  return `${print?'':'<div class="tw">'}<table class="${cls}${print?'':' wide'}"><thead><tr><th>#</th><th>رقم المنتج</th><th>الرقم الثاني</th><th>المنتج</th><th>العميل</th><th>أضافه</th><th>تاريخ الإضافة</th><th>موعد التسليم</th>${fin?'<th>التكلفة</th><th>البيع</th><th>الربح</th>':''}<th>الحالة / الموقع</th><th>المسار</th><th>المواد</th><th>ملاحظات</th><th>وصل</th></tr></thead>
    <tbody>${rows.map((r,i)=>`<tr ${print?'':`onclick="go('productDetails',{id:'${r.id}'})" style="cursor:pointer"`}><td>${i+1}</td><td>${esc(r.product_number)}</td><td>${esc(r.odoo_number||'—')}</td><td><b>${esc(r.product_name)}</b>${r.items_count?`<div class="small">${r.items_count} ايتم</div>`:''}</td><td>${esc(r.customer_name)}</td><td>${esc(r.creator||'—')}</td><td>${fmtD(String(new Date(new Date(r.created_at).getTime()+3*3600e3).toISOString()).slice(0,10))}</td><td class="${r.late?'late':''}" ${r.late&&!print?'style="color:var(--bad);font-weight:800"':''}>${fmtD(r.deadline)}${r.late?' ⚠️':''}</td>${fin?`<td>${money(r.cost)}</td><td>${money(r.price)}</td><td>${r.cost!=null&&r.price!=null?money(Number(r.price)-Number(r.cost)):'—'}</td>`:''}<td>${r.is_done?'✅ مكتمل'+(r.done_at?`<div class="small">${fmtDT(r.done_at)}</div>`:''):esc(r.locations||'—')}</td><td class="small">${esc(r.path||'—')}</td><td class="small">${esc(r.materials||'—')}</td><td>${r.notes_count||'—'}</td><td>${r.has_receipt?'✔️':'—'}</td></tr>`).join('')}</tbody>
    ${fin&&rows.length?`<tfoot><tr><td colspan="8">الإجمالي (${rows.length} منتج)</td><td>${money(sum('cost'))}</td><td>${money(sum('price'))}</td><td>${money(sum('price')-sum('cost'))}</td><td colspan="5"></td></tr></tfoot>`:''}</table>${print?'':'</div>'}`;
}
SCREENS.productsReport={title:'تقرير المنتجات الشامل',async view(p){
  const [a,b]=periodRange(p.period,p.from,p.to);
  const rows=await rpc('get_products_report',{p_from:new Date(a).toISOString(),p_to:new Date(b).toISOString(),p_status:p.status||'all'});

  const go2=(o)=>`replaceScreen('productsReport',${JSON.stringify({...p,...o}).replace(/"/g,"'")})`;
  return `<div class="hint">المنتجات حسب تاريخ إضافتها، مع كل مراحلها وموادها وملاحظاتها${isFin()?' وأسعارها وأرباحها':''}. اضغط على أي صف لفتح ملف المنتج.</div>
    <div class="tabs">${RPERIODS.map(([k,t])=>`<button class="${k===p.period?'on':''}" onclick="${go2({period:k})}">${t}</button>`).join('')}</div>
    ${p.period==='custom'?`<div class="card filters"><label class="fl"><span>من</span><input type="date" id="pr_from" value="${esc(p.from||'')}"></label><label class="fl"><span>إلى</span><input type="date" id="pr_to" value="${esc(p.to||'')}"></label><button class="btn primary" onclick="replaceScreen('productsReport',{period:'custom',status:'${p.status||'all'}',from:$('pr_from').value,to:$('pr_to').value})">عرض</button></div>`:''}
    <div class="tabs">${PSTATUS.map(([k,t])=>`<button class="${k===(p.status||'all')?'on':''}" onclick="${go2({status:k})}">${t}</button>`).join('')}</div>
    <div class="kpis">${prKpis(rows).map(([k,v,c])=>`<div class="kpi ${c}"><span>${k}</span><b>${esc(v)}</b></div>`).join('')}</div>
    <div class="card"><div class="pc-h"><b>${esc(periodLabel(p))} — ${esc(PSTATUS.find(x=>x[0]===(p.status||'all'))[1])}</b><span class="pill">${rows.length}</span></div>

}};
function printProductsReport(){
  const {p,rows}=S.prep;
  printHTML(`<div class="doc">${reportDocHead('تقرير المنتجات الشامل',periodLabel(p)+' — '+PSTATUS.find(x=>x[0]===(p.status||'all'))[1])}
    <div class="dkpis">${prKpis(rows).map(([k,v])=>`<div><span>${k}</span><b>${esc(v)}</b></div>`).join('')}</div>

    <div class="dsig"><div>توقيع المحاسب</div><div>توقيع مدير العمليات</div><div>توقيع المدير العام</div></div><div class="dfoot">XON PRODUCTION — تقرير المنتجات الشامل</div></div>`,{landscape:true});
}

    <button class="opt" onclick="go('reports')"><span class="ic">📊</span><div><b>تقرير قسم</b><div class="muted small">ما أنجزه أي قسم يومياً / أسبوعياً / شهرياً / سنوياً أو لفترة محددة</div></div></button></div>
    <div class="card"><div class="ct">طباعة سريعة لملف منتج</div><input id="pc_q" class="inp" placeholder="رقم المنتج أو الباركود أو الرقم الثاني" dir="ltr"><button class="btn primary block" onclick="quickPrint(this)">🖨️ بحث وطباعة</button></div>`;

async function quickPrint(btn){
  await busy(btn,async()=>{
    const q=$('pc_q').value.trim(); if(!q) throw new Error('اكتب رقم المنتج');
    const rows=await rpc('get_products_list2',{p_search:q,p_limit:5});
    if(!rows.length) throw new Error('لم يتم العثور على المنتج');
    const exact=rows.find(r=>[r.product_number,r.barcode,r.odoo_number].map(x=>String(x||'').toUpperCase()).includes(q.toUpperCase()))||(rows.length===1?rows[0]:null);
    if(!exact){ go('products',{q,pick:'print'}); return; }
    await loadFullWithFiles(exact.id); await printHTML(dossierHtml(S.full));
  });
}

/* ================= الحسابات ================= */
function accRow(a){
  return `<div class="arow" onclick="go('accountForm',{id:'${a.id}'})"><div><b>${esc(a.label||a.full_name||a.email)}</b><div class="muted small">${a.role!=='dept'?esc(ROLE_NAMES[a.role])+' · ':''}<span dir="ltr">${esc(a.email)}</span>${a.full_name&&a.label?' · '+esc(a.full_name):''}</div></div><span class="pill dim">✏️</span></div>`;
}
SCREENS.accounts={title:'الحسابات',async view(){
  const acc=await rpc('get_accounts'); S.acc=acc;
  let h=`<button class="btn primary block" style="margin:0 0 12px" onclick="go('accountForm',{})">➕ إضافة حساب</button>
    <div class="hint">القسم الذي له حساب يصير مفعّلاً ويظهر بقائمة التحويل. القسم بدون حساب مخفي.</div>
    <div class="card"><div class="ct">الإدارة</div>${acc.filter(a=>a.role!=='dept').map(accRow).join('')||'<div class="muted">—</div>'}</div>`;
  DEPTS.forEach(d=>{
    const list=acc.filter(a=>a.department_id===d.id);
    h+=`<div class="card ${list.length?'':'off'}"><div class="pc-h"><b>${esc(d.name)}</b>${list.length?`<span class="pill">${list.length} حساب</span>`:'<span class="pill dim">غير مفعّل</span>'}</div>${list.map(accRow).join('')}<button class="btn link sm" onclick="go('accountForm',{dept:${d.id}})">➕ إضافة حساب لهذا القسم</button></div>`;
  });
  return h;
}};
SCREENS.accountForm={title:p=>p.id?'تعديل حساب':'حساب جديد',async view(p){
  if(!S.acc) S.acc=await rpc('get_accounts');
  if(p.id){
    const a=S.acc.find(x=>x.id===p.id); if(!a) throw new Error('الحساب غير موجود');
    S.af={id:a.id,email:a.email};
    return `<div class="card"><div class="pill gold">${a.role==='dept'?esc(a.department):esc(ROLE_NAMES[a.role])}</div>
      ${field('a_name','اسم صاحب الحساب',a.full_name)}${field('a_label','التسمية (مثل: مبيعات 1، تركيب 2)',a.label||'')}
      ${field('a_email','البريد الإلكتروني',a.email,'email','dir="ltr"')}${field('a_pass','كلمة مرور جديدة (اتركها فارغة إذا لا تريد تغييرها)','','text','dir="ltr" autocomplete="new-password"')}
      <button class="btn primary block" onclick="saveAccount(this)">💾 حفظ</button>
      ${a.id!==ME.id?`<button class="btn danger block" onclick="deleteAccount(this)">🗑️ حذف الحساب</button>`:''}</div>`;
  }
  S.af={id:null};
  const pre=p.dept?Number(p.dept):null;
  const n=pre?S.acc.filter(a=>a.department_id===pre).length+1:1;
  const suggest=pre===1?'مبيعات '+n:(pre===16?'تركيب '+n:'');
  return `<div class="card"><label class="fl"><span>نوع الحساب</span><select id="a_role" onchange="$('deptWrap').style.display=this.value==='dept'?'':'none'">
      <option value="dept" ${pre||!p.dept?'selected':''}>حساب قسم</option>${ME.role==='gm'?'<option value="gm">مدير عام</option>':''}<option value="fm">مدير مالي</option><option value="ops">مدير عمليات</option><option value="coord">منسّق</option></select></label>
    <div id="deptWrap"><label class="fl"><span>القسم</span><select id="a_dept">${DEPTS.map(d=>`<option value="${d.id}" ${d.id===pre?'selected':''}>${esc(d.name)}</option>`).join('')}</select></label></div>
    ${field('a_name','اسم صاحب الحساب','')}${field('a_label','التسمية (مثل: مبيعات 1، تركيب 2)',suggest)}
    ${field('a_email','البريد الإلكتروني','','email','dir="ltr" autocomplete="off"')}${field('a_pass','كلمة المرور (6 أحرف على الأقل)','','text','dir="ltr" autocomplete="new-password"')}
    <button class="btn primary block" onclick="saveAccount(this)">💾 إنشاء الحساب</button></div>`;
}};
async function saveAccount(btn){
  await busy(btn,async()=>{
    const v=id=>($(id)?.value||'').trim();
    if(S.af.id){
      const body={id:S.af.id,full_name:v('a_name'),label:v('a_label')};
      if(v('a_email')&&v('a_email').toLowerCase()!==String(S.af.email).toLowerCase()) body.email=v('a_email');
      if(v('a_pass')) body.password=v('a_pass');
      await manage('update_account',body);
    }else{
      const role=v('a_role');
      if(!v('a_email')||!v('a_pass')) throw new Error('اكتب الإيميل وكلمة المرور');
      await manage('create_account',{role,department_id:role==='dept'?Number(v('a_dept')):null,full_name:v('a_name'),label:v('a_label'),email:v('a_email'),password:v('a_pass')});
    }
    S.acc=null; toast('تم الحفظ ✅'); goBack();
  });
}
async function deleteAccount(btn){
  if(!await confirmBox('حذف هذا الحساب نهائياً؟ (حركات المنتجات السابقة تبقى محفوظة)','حذف',true)) return;
  await busy(btn,async()=>{ await manage('delete_account',{id:S.af.id}); S.acc=null; toast('تم حذف الحساب'); goBack(); });
}

window.addEventListener('unhandledrejection',e=>{ toast(errText(e.reason),'bad'); });
window.addEventListener('error',e=>{ if(e&&e.message&&!/Script error/i.test(e.message)) toast('حدث خطأ: '+e.message,'bad'); });
sb.auth.onAuthStateChange(ev=>{ if(ev==='SIGNED_OUT'&&ME){ ME=null; showLogin(); } });
(async function init(){
  try{ const {data:{session}}=await sb.auth.getSession(); if(!session) return showLogin(); await afterLogin(true); }
  catch(e){ showLogin(errText(e)); }
})();
